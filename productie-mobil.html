<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ABUS PROducție - Mobil</title>

    <!-- PWA: instalare ca aplicație pe telefon -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2A4A">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ABUS PRO">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        abus: { blue: '#0F2A4A', orange: '#F5821F', dark: '#111827', gray: '#F3F4F6' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; font-size: 17px; -webkit-tap-highlight-color: transparent; }
        input, select, textarea, button { font-size: 17px; }
        .slide-up { animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        ::-webkit-scrollbar { width: 0; height: 0; }
        .btn-tap { transition: transform 0.1s, filter 0.1s; }
        .btn-tap:active { transform: scale(0.96); filter: brightness(0.92); }
        .pulse-dot { animation: pulseDot 1.6s infinite; }
        @keyframes pulseDot {
            0% { box-shadow: 0 0 0 0 rgba(59,130,246,0.5); }
            70% { box-shadow: 0 0 0 8px rgba(59,130,246,0); }
            100% { box-shadow: 0 0 0 0 rgba(59,130,246,0); }
        }
        @keyframes deliveryPulseSlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
        @keyframes deliveryPulseFast { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        .delivery-pulse-orange { animation: deliveryPulseSlow 3.5s ease-in-out infinite; }
        .delivery-pulse-red { animation: deliveryPulseFast 0.8s ease-in-out infinite; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <!-- ECRAN LOGIN -->
    <div id="loginScreen" class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-100 p-5">
        <div class="bg-white p-7 rounded-3xl shadow-xl w-full max-w-sm slide-up border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-20 h-20 bg-abus-blue text-white rounded-3xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-abus-blue/30">
                    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </div>
                <h1 class="text-3xl font-black text-slate-800 tracking-tight">ABUS<span class="text-abus-orange">PROducție</span></h1>
                <p class="text-base text-slate-500 mt-2 font-medium">Ecran producție · Mobil</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Utilizator</label>
                    <input type="text" id="usernameInput" required autocapitalize="off" class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-abus-blue outline-none transition-all text-lg font-semibold" placeholder="Nume cont">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Parolă</label>
                    <input type="password" id="passwordInput" required class="w-full px-5 py-4 rounded-2xl bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-abus-blue outline-none transition-all text-lg font-semibold" placeholder="••••••••">
                </div>
                <label class="flex items-center gap-3 py-2 select-none">
                    <input type="checkbox" id="rememberMeInput" checked class="w-6 h-6 rounded-lg accent-abus-blue">
                    <span class="text-base font-bold text-slate-600">Ține-mă minte pe acest telefon</span>
                </label>
                <button type="submit" class="btn-tap w-full bg-abus-blue text-white font-bold py-5 px-4 rounded-2xl transition-colors shadow-lg shadow-abus-blue/20 flex justify-center items-center gap-2 mt-4 text-xl">
                    <span>Conectare</span>
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- HEADER -->
    <header id="appHeader" class="hidden bg-abus-blue text-white sticky top-0 z-30 shadow-md">
        <div class="px-4 py-3 flex items-center justify-between">
            <div>
                <div class="font-black text-lg leading-none">ABUS<span class="text-abus-orange">PRO</span></div>
                <div id="loggedInUser" class="text-[13px] text-slate-300 font-semibold mt-0.5">-</div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="manualSync()" class="bg-white/10 active:bg-white/20 p-3 rounded-xl transition-colors">
                    <svg id="syncIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </button>
                <button onclick="openPasswordModal()" class="bg-white/10 active:bg-white/20 p-3 rounded-xl transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <button onclick="logout()" class="bg-white/10 active:bg-red-500/60 p-3 rounded-xl transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                </button>
            </div>
        </div>
        <!-- Bara de căutare -->
        <div class="px-4 pb-3">
            <div class="flex items-center gap-2 bg-white/10 rounded-xl px-3 py-2.5">

                <input type="text" id="searchInput" onkeyup="filterList()" placeholder="Caută comandă, locație, AN..." class="bg-transparent outline-none border-none text-white placeholder-slate-300 w-full text-base font-medium">

    <!-- BANNER ATENȚIONARE -->
    <div id="breakBanner" class="hidden mx-4 mt-4 px-4 py-3.5 rounded-2xl text-sm font-black flex items-center gap-2 flex-wrap bg-amber-50 text-amber-800 border-2 border-amber-300">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="breakBannerText">Pauză generală activă</span>

    <div id="workBanner" class="hidden mx-4 mt-4 px-4 py-3.5 rounded-2xl text-base font-bold flex items-center gap-2 flex-wrap"></div>

    <!-- MAIN -->
    <main id="appMain" class="hidden px-4 pt-4 pb-10 max-w-2xl mx-auto">
        <div id="groupsContainer" class="space-y-4"></div>
        <div id="emptyState" class="hidden text-center py-16 text-slate-400">
            <svg class="w-16 h-16 mx-auto mb-3 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
            <p class="font-bold text-lg">Nicio operație găsită.</p>
        </div>
    </main>

    <!-- MODAL EDITARE LOCAȚIE -->
    <div id="locationModal" class="fixed inset-0 bg-slate-900/70 hidden overflow-y-auto h-full w-full flex items-center justify-center z-[100] backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-sm transform transition-all scale-95 opacity-0" id="locModalContent">
            <h3 class="text-xl font-black text-slate-800 mb-5 flex items-center gap-2">
                <svg class="w-6 h-6 text-abus-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                Editare Post de Lucru
            </h3>
            <label class="block text-sm font-bold text-slate-500 uppercase tracking-wide mb-2">Locație (Echipament)</label>
            <select id="newLocationInput" onchange="onLocationSelectChange()" class="w-full px-4 py-3.5 rounded-xl bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-abus-blue outline-none mb-4 text-lg font-semibold appearance-none"></select>
            <label class="block text-sm font-bold text-slate-500 uppercase tracking-wide mb-2">Descriere / Observații</label>
            <textarea id="newDescInput" class="w-full px-4 py-3.5 rounded-xl bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-abus-blue outline-none mb-5 text-base font-medium resize-none h-24" placeholder="Detalii tehnice..."></textarea>
            <div class="flex gap-3">
                <button onclick="closeLocationModal()" class="btn-tap flex-1 py-4 bg-white border-2 border-slate-200 text-slate-600 font-bold rounded-xl text-lg">Anulează</button>
                <button onclick="saveLocation()" class="btn-tap flex-1 py-4 bg-abus-blue text-white font-bold rounded-xl shadow-md text-lg">Salvează</button>
            </div>
        </div>
    </div>

    <!-- MODAL SCHIMBARE PAROLĂ -->
    <div id="passwordModal" class="fixed inset-0 bg-slate-900/70 hidden overflow-y-auto h-full w-full flex items-center justify-center z-[100] backdrop-blur-sm p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl w-full max-w-sm transform transition-all scale-95 opacity-0" id="pwdModalContent">
            <h3 class="text-xl font-black text-slate-800 mb-5 flex items-center gap-2">
                <svg class="w-6 h-6 text-abus-blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                Schimbă parola
            </h3>
            <label class="block text-sm font-bold text-slate-500 uppercase tracking-wide mb-2">Parola actuală</label>
            <input type="password" id="oldPasswordInput" class="w-full px-4 py-3.5 rounded-xl bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-abus-blue outline-none mb-4 text-lg font-semibold">
            <label class="block text-sm font-bold text-slate-500 uppercase tracking-wide mb-2">Parola nouă</label>
            <input type="password" id="newPasswordInput" class="w-full px-4 py-3.5 rounded-xl bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-abus-blue outline-none mb-4 text-lg font-semibold">
            <label class="block text-sm font-bold text-slate-500 uppercase tracking-wide mb-2">Confirmă parola nouă</label>
            <input type="password" id="confirmPasswordInput" class="w-full px-4 py-3.5 rounded-xl bg-slate-50 border-2 border-slate-200 focus:bg-white focus:border-abus-blue outline-none mb-5 text-lg font-semibold">
            <div class="flex gap-3">
                <button onclick="closePasswordModal()" class="btn-tap flex-1 py-4 bg-white border-2 border-slate-200 text-slate-600 font-bold rounded-xl text-lg">Anulează</button>
                <button onclick="savePassword()" class="btn-tap flex-1 py-4 bg-abus-blue text-white font-bold rounded-xl shadow-md text-lg">Salvează</button>
            </div>
        </div>
    </div>

    <!-- MODAL VIZUALIZARE DESEN PDF (fullscreen pe mobil) -->
    <div id="drawingModal" class="fixed inset-0 bg-slate-900 hidden z-[200]">
        <div class="bg-slate-900 border-b border-slate-700 flex-shrink-0">
            <div class="flex items-center justify-between px-4 py-3">
                <h3 id="drawingModalTitle" class="text-sm font-black text-white truncate pr-4">Desen tehnic</h3>
                <button onclick="closeDrawingModal()" class="text-white bg-white/10 active:bg-white/20 p-2.5 rounded-xl transition-colors flex-shrink-0">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div id="drawingModalActions" class="hidden px-4 pb-3 flex items-center gap-2"></div>
        </div>
        <div id="drawingModalBody" class="flex-1 overflow-auto bg-slate-100 flex items-center justify-center">
            <span class="text-slate-400 font-medium">Se caută desenul...</span>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toastContainer" class="fixed bottom-6 left-4 right-4 z-[300] flex flex-col gap-2 pointer-events-none items-center"></div>

    <script>
        // URL-ul scriptului PRINCIPAL (Sheet-ul nou: Comenzi, UrmarireComenzi_OP, desene)
        // PWA: înregistrare service worker (necesar pentru instalare pe telefon)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }

        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxGDG5av7868vPdCk-WFvj7V2sDjpywFVw8-dD2X41kpmbq2BWlp84hrgh49bHHRxT8/exec';
        // URL-ul scriptului de AUTENTIFICARE (Sheet-ul vechi: Utilizatori - login și schimbare parolă)
        // ⚠️ ÎNLOCUIEȘTE cu URL-ul deployment-ului scriptului auth-appscript.gs, legat de Sheet-ul vechi!
        const AUTH_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxGDG5av7868vPdCk-WFvj7V2sDjpywFVw8-dD2X41kpmbq2BWlp84hrgh49bHHRxT8/exec';

        // Lista predefinită de locații/utilaje - cod prescurtat + denumire completă
        const WORK_LOCATIONS = [
            { cod: 'PLSM', nume: 'Plasma mare' },
            { cod: 'PLSm', nume: 'Plasma mica' },
            { cod: 'PLZ', nume: 'Polizor cu banda' },
            { cod: 'PLZ1', nume: 'Polizor' },
            { cod: 'PLZ2', nume: 'Polizor ajustare flex' },
            { cod: 'S2', nume: 'Sablare noua' },
            { cod: 'S1', nume: 'Sablare vechie' },
            { cod: 'AKR', nume: 'Centru Akira' },
            { cod: 'CTC', nume: 'Control tehnic de calitate' },
            { cod: 'BDP', nume: 'Ambalare/depozitare' },
            { cod: 'MDF', nume: 'Fierastrau MEBA' },
            { cod: 'PR3', nume: 'Presa Mare M' },
            { cod: 'PR2', nume: 'Presa Mijl. M2' },
            { cod: 'T1', nume: 'Toba' },
            { cod: 'SD1', nume: 'Sudura 1' },
            { cod: 'SD2', nume: 'Sudura 2' },
            { cod: 'ZNC', nume: 'Zincare' },
            { cod: 'BCM', nume: 'Banc Montaj' },
            { cod: 'BCAS', nume: 'Banc sudura/curatare' },
            { cod: 'GH1', nume: 'Ghiliotina mica' },
            { cod: 'GH2', nume: 'Ghiliotina mare' },
            { cod: 'SPV', nume: 'Spalare-Vopsire' },
            { cod: 'F3', nume: 'Freza FU36' },
            { cod: 'FB', nume: 'Freza Bridgeport' },
            { cod: 'G1', nume: 'Masina gaurit monofazat' },
            { cod: 'G2', nume: 'Masina de gaurit si filetat' },
            { cod: 'SPL', nume: 'Masina de spalat' },
            { cod: 'STR1', nume: 'Strung clasic Weiller Condor' },
            { cod: 'SCNC', nume: 'Strung CNC Leadwell' },
            { cod: 'SN400', nume: 'Strung clasic SN400' },
            { cod: 'ABK', nume: 'Abkant Baykal' }
        ];

        // Pauze fixe zilnice - nimic nu poate porni în acest interval, tot ce e activ se pune pe pauză automat
        const BREAK_PERIODS = [
            { start: '10:30', end: '11:00' },
            { start: '19:00', end: '19:30' }
        ];

        function timeToMinutes(t) {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        }

        function getCurrentBreakPeriod() {
            const now = new Date();
            const mins = now.getHours() * 60 + now.getMinutes();
            for (const b of BREAK_PERIODS) {
                if (mins >= timeToMinutes(b.start) && mins < timeToMinutes(b.end)) return b;
            }
            return null;
        }

        function isAutoPausedForBreak(op) {
            if (op.status !== 'paused') return false;
            const log = op.processLog || [];
            for (let i = log.length - 1; i >= 0; i--) {
                if (log[i].action === 'pauza') return !!log[i].autoBreak;
                if (log[i].action === 'start' || log[i].action === 'resume' || log[i].action === 'stop' || log[i].action === 'stop_partial') return false;
            }
            return false;
        }

        async function autoTransitionOp(op, newStatus, isBreakStart) {
            const now = new Date().toISOString();
            if (!op.timestamps) op.timestamps = { start: null, pauses: [], stop: null };
            if (!op.timestamps.pauses) op.timestamps.pauses = [];
            if (!op.processLog) op.processLog = [];

            if (newStatus === 'paused') {
                op.timestamps.pauses.push({ type: 'start', time: now });
                op.processLog.push({ action: 'pauza', time: now, user: 'Sistem (pauză generală)', autoBreak: true });
            } else {
                op.timestamps.pauses.push({ type: 'end', time: now });
                op.processLog.push({ action: 'resume', time: now, user: 'Sistem (pauză generală)' });
            }
            op.status = newStatus;

            if (op.operator === appState.currentUser.nume) {
                showToast(isBreakStart
                    ? `⏸ Pauză generală — "${op.template.locatie || '-'}" a fost pusă automat pe pauză.`
                    : `▶ Pauza s-a terminat — "${op.template.locatie || '-'}" a fost reluată automat.`);
            }

            try {
                await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateOperation', opData: op }) });
            } catch (e) {}
        }

        function updateBreakBanner() {
            const banner = document.getElementById('breakBanner');
            if (!banner) return;
            const activeBreak = getCurrentBreakPeriod();
            if (activeBreak) {
                banner.classList.remove('hidden');
                document.getElementById('breakBannerText').textContent = `Pauză generală (${activeBreak.start}-${activeBreak.end}) — START blocat, ce era activ e pe pauză.`;
            } else {
                banner.classList.add('hidden');
            }
        }

        async function checkBreakAutoPause() {
            updateBreakBanner();
            const currentBreak = getCurrentBreakPeriod();
            let changed = false;

            if (currentBreak) {
                const toPause = appState.operations.filter(o => o.status === 'active');
                for (const op of toPause) { await autoTransitionOp(op, 'paused', true); changed = true; }
            } else {
                const toResume = appState.operations.filter(o => o.status === 'paused' && isAutoPausedForBreak(o));
                for (const op of toResume) { await autoTransitionOp(op, 'active', false); changed = true; }
            }

            if (changed) renderList();
        }

        const appState = {
            currentUser: null,
            operations: [],
            locationEditOpId: null,
            syncInterval: null,
            expandedGroups: {},
            isLocallyInteracting: false
        };

        const loginScreen = document.getElementById('loginScreen');
        const appHeader = document.getElementById('appHeader');
        const appMain = document.getElementById('appMain');
        const groupsContainer = document.getElementById('groupsContainer');

        // ============= LOGIN =============
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<svg class="animate-spin h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg> Se verifică...`;

            try {
                const response = await fetch(AUTH_SCRIPT_URL, {
                    method: 'POST', body: JSON.stringify({ action: 'login', username, password })
                });
                const data = await response.json();
                if (data.success) {
                    appState.currentUser = data.user;

        // ============= HELPERS (identice cu aplicația principală) =============
        const mobileMonthsShort = ['ian','feb','mar','apr','mai','iun','iul','aug','sep','oct','nov','dec'];

        // Parsează data de livrare, indiferent de format: dd.mm.yyyy (nou) sau yyyy-mm-dd (vechi/moștenit)
        function parseDataLivrare(dateStr) {
            if (!dateStr) return null;
            const s = String(dateStr).trim();
            if (s.includes('.')) {
                const parts = s.split('.');
                if (parts.length === 3) {
                    const d = new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
                    return isNaN(d.getTime()) ? null : d;
                }
            }
            const d = new Date(s);
            return isNaN(d.getTime()) ? null : d;
        }

        function formatDataLivrare(dateStr) {
            if (!dateStr) return 'Fără dată';
            const d = parseDataLivrare(dateStr);
            if (!d) return dateStr;
            const day = String(d.getDate()).padStart(2, '0');
            return `ABUS LIVRARE ${day}.${mobileMonthsShort[d.getMonth()]}.${d.getFullYear()}`;
        }

        function getDeliveryUrgencyLevel(dateStr) {
            if (!dateStr) return null;
            const d = parseDataLivrare(dateStr);
            if (!d) return null;
            const now = new Date(); now.setHours(0, 0, 0, 0);
            d.setHours(0, 0, 0, 0);
            const daysLeft = Math.round((d - now) / 86400000);
            if (daysLeft > 21) return 'green';
            if (daysLeft > 7) return 'orange';
            return 'red';
        }

        function getDeliveryTextClass(dateStr) {
            const level = getDeliveryUrgencyLevel(dateStr);
            if (level === 'green') return 'text-green-300';
            if (level === 'orange') return 'text-abus-orange delivery-pulse-orange';
            if (level === 'red') return 'text-red-400 delivery-pulse-red';
            return 'text-white';
        }

        function sanitizeId(id) {
            let s = String(id);
            if (s.includes('T') && s.includes('Z')) {
                let d = new Date(s);
                if (!isNaN(d.getTime())) return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}`;
            }
            return s;
        }

        function extractOpSeq(template) {
            if (template.opSeq !== undefined && template.opSeq !== '') return parseInt(template.opSeq, 10) || 0;
            const idOp = String(template.id_op || '');
            const parenMatch = idOp.match(/\((\d+)\)/);
            if (parenMatch) return parseInt(parenMatch[1], 10);
            return parseInt(idOp.replace(/\D/g, '')) || 0;
        }

        function calculateElapsedTime(op) {
            if (!op.timestamps || !op.timestamps.start) return 0;
            let now = new Date();
            let end = op.timestamps.stop ? new Date(op.timestamps.stop) : now;
            let totalMs = end - new Date(op.timestamps.start);
            let pauseMs = 0, currentPauseStart = null;
            (op.timestamps.pauses || []).forEach(p => {
                if (p.type === 'start') currentPauseStart = new Date(p.time);
                else if (p.type === 'end' && currentPauseStart) { pauseMs += (new Date(p.time) - currentPauseStart); currentPauseStart = null; }
            });
            if (currentPauseStart && !op.timestamps.stop) pauseMs += (now - currentPauseStart);
            return Math.max(0, Math.floor((totalMs - pauseMs) / 60000));
        }

        function operatorHasFunction(op) {
            if (!appState.currentUser) return false;
            if (appState.currentUser.rol === 'Admin') return true;
            const locatie = (op.template.locatie || '').trim().toLowerCase();
            if (!locatie) return true;
            const functii = (appState.currentUser.functii || '').split(',').map(f => f.trim().toLowerCase()).filter(Boolean);
            return functii.includes(locatie);
        }

        function isCurrentSessionPartial(op) {
            const log = op.processLog || [];
            for (let i = log.length - 1; i >= 0; i--) {
                if (log[i].action === 'start' || log[i].action === 'resume') return !!log[i].partial;
                if (log[i].action === 'stop' || log[i].action === 'stop_partial') return false;
            }
            return false;
        }

        function showToast(msg, isErr = false) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `px-5 py-4 rounded-2xl shadow-xl font-bold text-base flex items-center gap-3 transform transition-all duration-300 translate-y-10 opacity-0 border max-w-sm w-full pointer-events-auto ${isErr ? 'bg-red-50 text-red-700 border-red-200' : 'bg-slate-800 text-white border-slate-700'}`;
            const icon = isErr
                ? `<svg class="w-6 h-6 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                : `<svg class="w-6 h-6 text-green-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>`;
            toast.innerHTML = `${icon} <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        // ============= ACȚIUNI OPERAȚIE =============
        window.confirmFinal = function(operationId) {
            const op = appState.operations.find(o => o.id === operationId);
            if (!op) return;
            if (!confirm(`Ești sigur că ai finalizat operația "${op.orderNumber}-${sanitizeId(op.template.id_op)}" (${op.template.locatie || '-'})?\n\nNu mai poate fi anulat.`)) return;
            updateStatus(operationId, 'completed');
        };

        window.updateStatus = function(operationId, newStatus, partial) {
            const op = appState.operations.find(o => o.id === operationId);
            if (!op) return;
            if (!operatorHasFunction(op)) {
                showToast(`Nu ai funcția pentru locația "${op.template.locatie}".`, true);
                return;
            }
            if (newStatus === 'active') {
                const activeBreak = getCurrentBreakPeriod();
                if (activeBreak) {
                    showToast(`Este pauză generală (${activeBreak.start}-${activeBreak.end}). Nu poți porni nimic acum.`, true);
                    return;
                }
                const otherActive = appState.operations.find(o =>
                    o.id !== operationId && o.status === 'active' && o.operator === appState.currentUser.nume
                );
                if (otherActive) {
                    const otherSafeId = sanitizeId(otherActive.template.id_op);
                    showToast(`Ai deja o operație în execuție: ${otherActive.orderNumber}-${otherSafeId} (${otherActive.template.locatie || '-'}). Oprește-o sau pune-o pe pauză înainte de a porni alta.`, true);
                    return;
                }
            }
            appState.isLocallyInteracting = true;
            const now = new Date().toISOString();
            if (!op.timestamps) op.timestamps = { start: null, pauses: [], stop: null };
            if (!op.timestamps.pauses) op.timestamps.pauses = [];
            if (!op.processLog) op.processLog = [];

            let actionName = '';
            if (newStatus === 'active') {
                actionName = op.timestamps.start ? 'resume' : 'start';
                if (!op.timestamps.start) op.timestamps.start = now;
                if (op.status === 'paused') op.timestamps.pauses.push({ type: 'end', time: now });
                op.operator = appState.currentUser.nume;
            } else if (newStatus === 'paused') {
                actionName = 'pauza';
                op.timestamps.pauses.push({ type: 'start', time: now });
            } else if (newStatus === 'completed') {
                actionName = 'stop';
                op.timestamps.stop = now;
            }
            op.status = newStatus;

            const logEntry = { action: actionName, time: now, user: appState.currentUser.nume };
            if (actionName === 'stop') logEntry.duration = calculateElapsedTime(op);
            if (partial && (actionName === 'start' || actionName === 'resume')) logEntry.partial = true;
            op.processLog.push(logEntry);

            renderList();

            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateOperation', opData: op }) })
                .then(r => r.json())
                .then(result => {
                    setTimeout(() => { appState.isLocallyInteracting = false; }, 2000);
                    if (!result.success) { showToast("Eroare salvare: " + result.error, true); fetchData(true); }
                })
                .catch(() => { appState.isLocallyInteracting = false; showToast("Eroare de comunicare.", true); });
        };

        window.startPartial = function(operationId) {
            const op = appState.operations.find(o => o.id === operationId);
            if (!op) return;
            if (!operatorHasFunction(op)) { showToast(`Nu ai funcția pentru locația "${op.template.locatie}".`, true); return; }
            const siblings = appState.operations.filter(o => o.orderNumber === op.orderNumber);
            if (siblings.length > 0) {
                const minSeq = Math.min(...siblings.map(s => extractOpSeq(s.template)));
                const firstOpDone = siblings.filter(s => extractOpSeq(s.template) === minSeq).every(s => s.status === 'completed');
                if (!firstOpDone) {
                    showToast('Prima operație a comenzii (debitare) trebuie finalizată înainte de start parțial.', true);
                    return;
                }
            }
            if (!confirm('Operația anterioară din secvență nu e finalizată complet.\n\nPornești parțial, pe propria răspundere?')) return;
            updateStatus(operationId, 'active', true);
        };

        window.stopPartial = function(operationId) {
            const op = appState.operations.find(o => o.id === operationId);
            if (!op) return;
            if (!operatorHasFunction(op)) { showToast(`Nu ai funcția pentru locația "${op.template.locatie}".`, true); return; }
            if (!confirm('Închizi sesiunea parțială?\n\nTimpul lucrat se salvează, iar operația rămâne "de făcut".')) return;
            appState.isLocallyInteracting = true;
            const now = new Date().toISOString();
            const duration = calculateElapsedTime(op);
            if (!op.processLog) op.processLog = [];
            op.processLog.push({ action: 'stop_partial', time: now, user: appState.currentUser.nume, duration, partial: true });
            op.timestamps = { start: null, pauses: [], stop: null };
            op.status = 'pending';
            renderList();
            fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateOperation', opData: op }) })
                .then(r => r.json())
                .then(result => {
                    setTimeout(() => { appState.isLocallyInteracting = false; }, 2000);
                    if (!result.success) { showToast("Eroare salvare: " + result.error, true); fetchData(true); }
                    else showToast(`Sesiune parțială închisă (${duration} min).`);
                })
                .catch(() => { appState.isLocallyInteracting = false; showToast("Eroare de comunicare.", true); });
        };

        function populateLocationSelect(currentCode) {
            const select = document.getElementById('newLocationInput');
            select.innerHTML = '<option value="">-- Alege locația --</option>';
            let found = false;

            const isAdminUser = appState.currentUser.rol === 'Admin';
            const myFunctii = (appState.currentUser.functii || '').split(',').map(f => f.trim().toLowerCase()).filter(Boolean);
            const availableLocations = isAdminUser
                ? WORK_LOCATIONS
                : WORK_LOCATIONS.filter(loc => myFunctii.includes(loc.cod.toLowerCase()));

            availableLocations.forEach(loc => {
                const opt = document.createElement('option');
                opt.value = loc.cod;
                opt.textContent = `${loc.cod} — ${loc.nume}`;
                if (loc.cod === currentCode) { opt.selected = true; found = true; }
                select.appendChild(opt);
            });
            if (currentCode && !found) {
                const opt = document.createElement('option');
                opt.value = currentCode;
                opt.textContent = `${currentCode} (locația curentă)`;
                opt.selected = true;
                select.appendChild(opt);
            }
            if (availableLocations.length === 0 && !isAdminUser) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'Nu ai nicio funcție/locație asociată contului tău';
                opt.disabled = true;
                select.insertBefore(opt, select.firstChild);
            }
        }

                    else showToast("Detalii actualizate.");
                })
                .catch(() => { appState.isLocallyInteracting = false; showToast("Eroare comunicare.", true); });
        };

        window.toggleGroup = function(key) {
            appState.expandedGroups[key] = !appState.expandedGroups[key];
            renderList();
        };

        window.goToGroup = function(key) {
            appState.expandedGroups[key] = true;
            renderList();
            setTimeout(() => {
                const el = document.querySelector(`[data-group-key="${CSS.escape(key)}"]`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    el.classList.add('ring-4', 'ring-abus-orange');
                    setTimeout(() => el.classList.remove('ring-4', 'ring-abus-orange'), 1500);
                }
            }, 60);
        };

        window.filterList = function() {
            renderList();
        };

        // ============= RANDARE LISTĂ (carduri, mobil) =============
        function renderList() {
            const isAdmin = appState.currentUser.rol === 'Admin';
            const q = (document.getElementById('searchInput').value || '').toLowerCase().trim();

            const opsByOrder = {};
            appState.operations.forEach(op => {
                if (!opsByOrder[op.orderNumber]) opsByOrder[op.orderNumber] = [];
                opsByOrder[op.orderNumber].push(op);
            });

            let filteredOps = appState.operations;
            if (q) {
                filteredOps = filteredOps.filter(op =>
                    String(op.orderNumber||'').toLowerCase().includes(q) ||
                    String(op.abusType||'').toLowerCase().includes(q) ||
                    String(op.template.locatie||'').toLowerCase().includes(q) ||
                    String(op.template.descriere_op||'').toLowerCase().includes(q)
                );
            }

            const opsByDelivery = {};
            const deliveryKeys = [];
            filteredOps.forEach(op => {
                const key = (op.dataLivrare || '').trim() || '';
                if (!opsByDelivery[key]) { opsByDelivery[key] = []; deliveryKeys.push(key); }
                opsByDelivery[key].push(op);
            });
            deliveryKeys.sort((a, b) => {
                if (a === '') return 1;
                if (b === '') return -1;
                return (parseDataLivrare(a) || 0) - (parseDataLivrare(b) || 0);
            });

            groupsContainer.innerHTML = '';

            const anyExpanded = deliveryKeys.some(k => !!appState.expandedGroups[k]) || !!q;
            let renderedGroupsCount = 0;

            deliveryKeys.forEach(key => {
                const opsInGroup = opsByDelivery[key];
                const isExpanded = !!appState.expandedGroups[key] || !!q;
                const isDimmed = anyExpanded && !isExpanded;
                const pendingCount = opsInGroup.filter(o => o.status === 'pending').length;
                const activeCount = opsInGroup.filter(o => o.status === 'active' || o.status === 'paused').length;
                const completedCount = opsInGroup.filter(o => o.status === 'completed').length;
                const isFinalized = opsInGroup.length > 0 && completedCount === opsInGroup.length;

                // Pe mobil nu mai arătăm deloc grupurile complet finalizate
                if (isFinalized) return;
                renderedGroupsCount++;

                const orderCount = new Set(opsInGroup.map(o => o.orderNumber)).size;
                const groupProgress = opsInGroup.length > 0 ? Math.round((completedCount / opsInGroup.length) * 100) : 0;

                const groupDiv = document.createElement('div');
                groupDiv.dataset.groupKey = key;
                groupDiv.className = `rounded-2xl overflow-hidden shadow-sm transition-all duration-300 ${isDimmed ? 'opacity-40' : ''}`;

                const headerBg = isFinalized ? 'bg-emerald-600' : 'bg-abus-blue';
                groupDiv.innerHTML = `
                    <button onclick="toggleGroup('${key}')" class="btn-tap w-full ${headerBg} text-white px-4 py-4 flex items-center justify-between text-left">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-lg font-black ${isFinalized ? '' : getDeliveryTextClass(key)}">📅 ${formatDataLivrare(key)}</span>
                                ${isFinalized ? '<span class="bg-white/20 text-[11px] font-black px-2 py-0.5 rounded-full">FINALIZAT</span>' : ''}
                            </div>
                            <div class="text-[13px] font-semibold text-white/80">${orderCount} ${orderCount === 1 ? 'comandă' : 'comenzi'} · ${opsInGroup.length} operații · ${groupProgress}%</div>
                        </div>
                        <svg class="w-6 h-6 flex-shrink-0 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="w-full h-1.5 bg-white/20">
                        <div class="h-full ${isFinalized ? 'bg-white' : 'bg-abus-orange'}" style="width:${groupProgress}%"></div>
                    </div>
                `;

                if (isExpanded) {
                    const cardsWrap = document.createElement('div');
                    cardsWrap.className = 'bg-slate-100 p-3 space-y-2.5';

                    // Grupare pe comandă, în interiorul acestei date de livrare
                    const opsByOrderInGroup = {};
                    const orderKeysInGroup = [];
                    opsInGroup.forEach(op => {
                        const ok = op.orderNumber || '-';
                        if (!opsByOrderInGroup[ok]) { opsByOrderInGroup[ok] = []; orderKeysInGroup.push(ok); }
                        opsByOrderInGroup[ok].push(op);
                    });

                    const anyOrderExpandedInGroup = orderKeysInGroup.some(o => !!appState.expandedGroups[`${key}__o__${o}`]) || !!q;

                    orderKeysInGroup.forEach(orderNum => {
                        const opsInOrder = opsByOrderInGroup[orderNum];
                        const orderKey = `${key}__o__${orderNum}`;
                        const orderIsExpanded = !!appState.expandedGroups[orderKey] || !!q;
                        const orderCompleted = opsInOrder.filter(o => o.status === 'completed').length;
                        const orderActive = opsInOrder.filter(o => o.status === 'active' || o.status === 'paused').length;
                        const orderIsFinalized = opsInOrder.length > 0 && orderCompleted === opsInOrder.length;
                        const ansInOrder = [...new Set(opsInOrder.map(o => o.abusType).filter(Boolean))];

                        // Efect de focus: dacă o altă comandă din aceeași dată e deschisă, aceasta se estompează
                        const orderIsDimmed = anyOrderExpandedInGroup && !orderIsExpanded;

                        const orderWrap = document.createElement('div');
                        orderWrap.className = `rounded-xl overflow-hidden shadow-sm transition-all duration-300 ${orderIsDimmed ? 'opacity-40 blur-[1px] grayscale-[30%] pointer-events-none' : ''}`;
                        const orderHeaderBg = orderIsFinalized ? 'bg-emerald-500' : 'bg-slate-700';

                        orderWrap.innerHTML = `
                            <div onclick="toggleGroup('${orderKey}')" class="btn-tap w-full ${orderHeaderBg} text-white px-3.5 py-3 flex items-center justify-between text-left gap-2 cursor-pointer">
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center gap-2 flex-wrap">
                                        <span class="text-sm font-black">📦 Comandă ${orderNum}</span>
                                        ${orderIsFinalized ? '<span class="bg-white/20 text-[9px] font-black px-2 py-0.5 rounded-full">GATA</span>' : ''}
                                    </div>
                                    <div class="text-[11px] font-semibold text-white/70 mt-0.5">${opsInOrder.length} piese${orderActive > 0 ? ' · ' + orderActive + ' în lucru' : ''}</div>
                                </div>
                                ${ansInOrder.length > 0 ? `<span class="text-lg font-black text-white bg-white/25 px-3 py-1.5 rounded-lg flex-shrink-0 whitespace-nowrap">AN ${ansInOrder.join(', ')}</span>` : ''}
                                ${ansInOrder.length > 0 ? `<button onclick="event.stopPropagation(); openDrawing('${ansInOrder[0]}')" class="btn-tap text-white bg-white/15 p-2 rounded-lg flex-shrink-0" title="Deschide desenul (PDF)">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                                </button>` : ''}
                                <svg class="w-5 h-5 flex-shrink-0 transition-transform duration-200 ${orderIsExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        `;

                        if (orderIsExpanded) {
                            const piecesWrap = document.createElement('div');
                            piecesWrap.className = 'p-2.5 space-y-2.5 bg-slate-50';
                            opsInOrder.forEach(op => {
                                piecesWrap.appendChild(buildOpCard(op, opsByOrder, isAdmin));
                            });
                            orderWrap.appendChild(piecesWrap);
                        }

                        cardsWrap.appendChild(orderWrap);
                    });

                    groupDiv.appendChild(cardsWrap);
                }

                groupsContainer.appendChild(groupDiv);
            });

            document.getElementById('emptyState').classList.toggle('hidden', renderedGroupsCount > 0);

            renderWorkBanner();
        }

        function buildStatusLabel(status) {
            if (status === 'active') return `<div class="text-sm font-black text-abus-blue mb-1 flex items-center gap-1.5"><span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-abus-blue opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-abus-blue"></span></span>🔧 În curs de execuție</div>`;
            if (status === 'paused') return `<div class="text-sm font-black text-abus-orange mb-1">⏸ În pauză</div>`;
            if (status === 'completed') return `<div class="text-sm font-black text-emerald-600 mb-1">✅ Finalizat</div>`;
            return '';
        }

        function buildOpCard(op, opsByOrder, isAdmin) {
            let isLocked = false;
            const safeOpId = sanitizeId(op.template.id_op);
            const currentSeq = extractOpSeq(op.template);
            const siblings = opsByOrder[op.orderNumber] || [];
            for (let sib of siblings) {
                const sibSeq = extractOpSeq(sib.template);
                if (sibSeq < currentSeq && sib.status !== 'completed') { isLocked = true; break; }
            }
            const hasFunction = operatorHasFunction(op);

            // Start parțial are sens doar după ce prima operație (de regulă debitare/OP10) a produs deja piese
            let firstOpDone = false;
            if (siblings.length > 0) {
                const minSeq = Math.min(...siblings.map(s => extractOpSeq(s.template)));
                firstOpDone = siblings.filter(s => extractOpSeq(s.template) === minSeq).every(s => s.status === 'completed');
            }

            let accent = 'border-slate-300';
            let cardBg = 'bg-white';
            if (op.status === 'completed') { accent = 'border-emerald-400'; cardBg = 'bg-white opacity-80'; }
            else if (op.status === 'active') { accent = 'border-abus-blue'; cardBg = 'bg-abus-blue/5'; }
            else if (op.status === 'paused') { accent = 'border-abus-orange'; cardBg = 'bg-abus-orange/5'; }
            else if (isLocked) { accent = 'border-slate-300'; }
            else if (hasFunction) { accent = 'border-green-400'; cardBg = 'bg-green-50/70'; }

            const card = document.createElement('div');
            card.className = `rounded-2xl border-l-[6px] ${accent} ${cardBg} shadow-sm p-4`;

            let actionHtml = '';
            if (isLocked && op.status === 'pending') {
                actionHtml = `
                    <div class="flex flex-col gap-2 mt-3">
                        <span class="w-full text-center py-3 rounded-xl bg-slate-200 text-slate-500 font-black text-base">🔒 BLOCAT</span>
                        ${(hasFunction && firstOpDone) ? `<button onclick="startPartial('${op.id}')" class="btn-tap w-full py-3 rounded-xl bg-amber-100 text-amber-800 border-2 border-amber-300 font-black text-base">⚡ START PARȚIAL</button>` : ''}
                    </div>`;
            } else if (op.status !== 'completed' && !hasFunction) {
                actionHtml = `<span class="block w-full text-center py-3.5 rounded-xl bg-orange-50 text-orange-500 border-2 border-orange-200 font-black text-base mt-3">🔒 Necesită: ${op.template.locatie || 'N/A'}</span>`;
            } else if (op.status === 'pending') {
                actionHtml = `<button onclick="updateStatus('${op.id}', 'active')" class="btn-tap w-full py-4 rounded-xl bg-green-500 text-white font-black text-xl shadow-md mt-3">START</button>`;
            } else if (op.status === 'active') {
                const isPartial = isCurrentSessionPartial(op);
                actionHtml = `
                    <div class="mt-3 space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="updateStatus('${op.id}', 'paused')" class="btn-tap py-4 rounded-xl bg-amber-400 text-amber-900 font-black text-lg">PAUZĂ</button>
                            <button onclick="confirmFinal('${op.id}')" class="btn-tap py-4 rounded-xl bg-abus-orange text-white font-black text-lg">FINAL</button>
                        </div>
                        ${isPartial ? `<button onclick="stopPartial('${op.id}')" class="btn-tap w-full py-2.5 rounded-xl bg-white text-amber-700 border-2 border-amber-300 font-bold text-sm">⚡ STOP PARȚIAL</button>` : ''}
                    </div>`;
            } else if (op.status === 'paused') {
                const isPartial = isCurrentSessionPartial(op);
                actionHtml = `
                    <div class="mt-3 space-y-2">
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="updateStatus('${op.id}', 'active')" class="btn-tap py-4 rounded-xl bg-green-500 text-white font-black text-lg">REIA</button>
                            <button onclick="confirmFinal('${op.id}')" class="btn-tap py-4 rounded-xl bg-abus-orange text-white font-black text-lg">FINAL</button>
                        </div>
                        ${isPartial ? `<button onclick="stopPartial('${op.id}')" class="btn-tap w-full py-2.5 rounded-xl bg-white text-amber-700 border-2 border-amber-300 font-bold text-sm">⚡ STOP PARȚIAL</button>` : ''}
                    </div>`;
            } else if (op.status === 'completed') {
                actionHtml = `<span class="block w-full text-center py-3.5 rounded-xl bg-emerald-50 text-emerald-600 border-2 border-emerald-200 font-black text-lg mt-3">✅ GATA</span>`;
            }

            const isPartialAny = (op.processLog || []).some(e => e.partial);

            card.innerHTML = `
                <div class="flex items-start justify-between gap-2 mb-2">
                    <div class="min-w-0">
                        <div class="text-2xl font-black text-abus-blue leading-tight">AN ${op.abusType || '-'}</div>
                        <div class="flex items-center gap-2 flex-wrap mt-1">
                            <span class="text-[11px] font-black text-slate-500 bg-slate-100 px-2 py-0.5 rounded">Comandă ${op.orderNumber}</span>
                            <span class="text-[11px] font-bold text-slate-400">${op.orderNumber}-${safeOpId}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 flex-shrink-0">
                        ${isAdmin ? `<button onclick="deleteOperation('${op.id}')" class="btn-tap text-red-400 bg-red-50 p-2 rounded-xl" title="Șterge">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>` : ''}
                    </div>
                </div>

                <div class="flex items-center gap-2 mb-1 flex-wrap">
                    <span class="text-2xl font-black ${hasFunction && appState.currentUser.rol === 'Operator' ? 'text-abus-blue' : 'text-slate-800'} leading-tight">📍 ${op.template.descriere_locatie || op.template.locatie || 'Nespecificat'}</span>
                    ${hasFunction ? `<button onclick="openLocationModal('${op.id}')" class="text-slate-400 bg-slate-100 p-1.5 rounded-lg">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                    </button>` : ''}
                </div>
                ${(op.template.locatie && op.template.descriere_locatie) ? `<div class="text-[11px] font-bold text-slate-400 bg-slate-100 inline-block px-2 py-0.5 rounded mb-2">Cod: ${op.template.locatie}</div>` : ''}
                <div class="text-base text-slate-600 font-medium mb-1">${op.template.descriere_op || '-'}</div>
                ${buildStatusLabel(op.status)}
                ${op.operator ? `<div class="text-sm text-blue-600 font-bold mt-1">👤 ${op.operator}</div>` : ''}
                ${isPartialAny ? `<div class="text-sm text-amber-700 font-black mt-1">⚡ PARȚIAL</div>` : ''}
                ${actionHtml}
            `;
            return card;
        }

        function updateLiveTimers() {
            document.querySelectorAll('.live-timer').forEach(el => {
                const op = appState.operations.find(o => o.id === el.dataset.opId);
                if (op) el.innerText = `⏱ ${calculateElapsedTime(op)} m`;
            });
        }

        function renderWorkBanner() {
            const banner = document.getElementById('workBanner');
            if (appState.currentUser.rol !== 'Operator') { banner.classList.add('hidden'); return; }
            const myName = appState.currentUser.nume;
            const myActiveNow = appState.operations.filter(op => (op.status === 'active' || op.status === 'paused') && op.operator === myName);
            const available = appState.operations.filter(op => op.status === 'pending' && operatorHasFunction(op));
            banner.classList.remove('hidden');

            if (myActiveNow.length > 0) {
                const op = myActiveNow[0];
                banner.className = 'mx-4 mt-4 px-4 py-3.5 rounded-2xl text-base font-bold flex items-center gap-2 flex-wrap bg-abus-blue/10 text-abus-blue border-2 border-abus-blue/20';
                banner.innerHTML = `⏱️ Lucrezi la <strong>AN ${op.abusType||'-'}</strong> · ${op.template.locatie||'-'} <button onclick="goToGroup('${op.dataLivrare||''}')" class="btn-tap bg-abus-blue text-white px-3 py-1.5 rounded-lg font-black text-sm ml-auto">Vezi →</button>`;
            } else if (available.length > 0) {
                const groups = {}; const order = [];
                available.forEach(op => {
                    const key = op.dataLivrare || '';
                    if (!groups[key]) { groups[key] = new Set(); order.push(key); }
                    groups[key].add(op.abusType || '-');
                });
                const parts = order.slice(0, 3).map(k => `<button onclick="goToGroup('${k}')" class="btn-tap bg-white px-2.5 py-1 rounded-lg border-2 border-green-300 font-black text-sm">📅 ${formatDataLivrare(k)}</button>`);
                banner.className = 'mx-4 mt-4 px-4 py-3.5 rounded-2xl text-base font-bold flex items-center gap-2 flex-wrap bg-green-50 text-green-700 border-2 border-green-200';
                banner.innerHTML = `✅ Ai de lucru: ${parts.join(' ')}`;
            } else {
                banner.className = 'mx-4 mt-4 px-4 py-3.5 rounded-2xl text-base font-semibold flex items-center gap-2 bg-slate-100 text-slate-400 italic';
                banner.innerHTML = `Nu ai operații disponibile în acest moment.`;
            }
        }

    </script>
</body>
</html>
